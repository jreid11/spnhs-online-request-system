{% extends 'base.html' %}
{% block title %}Change Password | SPNHS-SHS{% endblock %}
{% block content %}
<div class="page-heading narrow"><div><span class="eyebrow">ACCOUNT SECURITY</span><h1>Change Password</h1></div></div>
<form method="post" class="settings-card narrow-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Current Password<input type="password" name="current_password" required></label>
  <label>New Password<input type="password" name="new_password" minlength="10" required></label>
  <label>Confirm New Password<input type="password" name="confirm_password" minlength="10" required></label>
  <button class="btn primary" type="submit">Update Password</button>
</form>
{% endblock %}
